services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart-library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library123}
      POSTGRES_DB: ${POSTGRES_DB:-smartlibrary}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library} -d ${POSTGRES_DB:-smartlibrary}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  library_pgdata:
